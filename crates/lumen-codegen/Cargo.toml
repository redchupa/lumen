[package]
name = "lumen-codegen"
description = "Lumen codegen — x86_64 (AVX2/AVX-512), ARM64 (NEON), CUDA"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
cuda = []

[dependencies]
lumen-ir.workspace = true
thiserror.workspace = true

[dev-dependencies]
lumen-dsl.workspace = true
lumen-jit.workspace = true
lumen-runtime.workspace = true
libloading = "0.8"
tempfile = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "matmul_scalar_vs_avx2"
harness = false
